<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Placeholder portrait">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="shine" cx="30%" cy="25%" r="60%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.35)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0)" />
    </radialGradient>
    <clipPath id="clip">
      <rect width="400" height="400" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="400" height="400" fill="url(#bg)" />
    <rect width="400" height="400" fill="url(#shine)" />

    <!-- shoulders -->
    <path d="M60 400 C 80 300, 150 270, 200 270 C 250 270, 320 300, 340 400 Z"
      fill="rgba(0,0,0,0.25)" />
    <path d="M70 400 C 90 310, 155 285, 200 285 C 245 285, 310 310, 330 400 Z"
      fill="rgba(255,255,255,0.12)" />

    <!-- head -->
    <circle cx="200" cy="180" r="78" fill="rgba(255,255,255,0.92)" />
    <!-- hair -->
    <path d="M126 175 C 130 110, 175 95, 200 95 C 235 95, 275 115, 278 170 C 268 150, 240 140, 215 142 C 185 144, 155 158, 142 178 Z"
      fill="rgba(20,20,30,0.85)" />

    <!-- eyes -->
    <circle cx="178" cy="180" r="5" fill="#1f2937" />
    <circle cx="222" cy="180" r="5" fill="#1f2937" />

    <!-- smile -->
    <path d="M178 210 Q 200 228 222 210" stroke="#1f2937" stroke-width="4"
      stroke-linecap="round" fill="none" />

    <!-- monogram chip -->
    <g transform="translate(290, 30)">
      <rect width="80" height="32" rx="16" fill="rgba(0,0,0,0.35)" />
      <text x="40" y="21" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#fff" letter-spacing="2">YN</text>
    </g>
  </g>
</svg>
